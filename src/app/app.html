<!-- Contenedor principal con el nuevo diseño "Cielo Etéreo" -->
<div class="app-container">
  
  <!-- Header: Se mantiene simple, el foco está en el contenido -->
  <app-mobile-shell></app-mobile-shell>
  
  <!-- Router Outlet para las rutas -->
  <div id="route-content" tabindex="-1"><router-outlet></router-outlet></div>
  
  <!-- Footer Global -->
  @if (!isPrimary) { <app-footer class="secondary-footer"></app-footer> }
  
  <!-- Gamification Notifications (Global) -->
  @if (!isPrimary) { <app-gamification-notifications></app-gamification-notifications> }
  
</div>
