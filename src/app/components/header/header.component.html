<header class="app-header-bar">
  <div class="header-glow"></div>
  <div class="header-line"></div>
  
  <div class="header-container">
    <a routerLink="/" class="brand-link" aria-label="Página de inicio de Nubisfera">
      <div class="brand-icon">
        <i class="fas fa-cloud-sun"></i>
      </div>
      <span class="brand-name">Nubisfera</span>
    </a>

    <!-- Botón hamburguesa para móvil -->
    <button class="mobile-menu-btn" (click)="toggleMobileMenu()" aria-label="Menú">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <!-- Navegación -->
    <nav class="main-nav" [class.mobile-open]="isMobileMenuOpen">
      <a routerLink="/dashboard" class="nav-link" (click)="closeMobileMenu()">
        <i class="fas fa-th-large"></i>
        <span>Dashboard</span>
      </a>
      <a routerLink="/comparar" class="nav-link" (click)="closeMobileMenu()">
        <i class="fas fa-columns"></i>
        <span>Comparar</span>
      </a>
      <a routerLink="/timeline" class="nav-link" (click)="closeMobileMenu()">
        <i class="fas fa-clock"></i>
        <span>Timeline</span>
      </a>
      <a routerLink="/acerca-de" class="nav-link" (click)="closeMobileMenu()">
        <i class="fas fa-info-circle"></i>
        <span>Acerca de</span>
      </a>
    </nav>

    <!-- Stats -->
    <div class="header-actions">
      @if (canInstall()) {
        <button class="install-btn" [class.banner-active]="showMobileBanner()" (click)="installPwa()" title="Instalar Nubisfera">
          <i class="fas fa-download"></i>
          <span>Instalar</span>
        </button>
      }
      <a routerLink="/logros" class="stats-link" title="Ver mis logros">
        <i class="fas fa-trophy"></i>
        <span class="level-badge">Nv.{{ currentLevel() }}</span>
      </a>
    </div>
  </div>

  <!-- Overlay para cerrar menú móvil -->
  @if (isMobileMenuOpen) {
    <div class="mobile-overlay" (click)="closeMobileMenu()"></div>
  }
</header>

<!-- Banner fijo inferior para instalar en móvil -->
@if (canInstall() && showMobileBanner()) {
  <div class="mobile-install-banner">
    <button class="mobile-install-btn" (click)="installPwa()">
      <i class="fas fa-download"></i>
      <span>Descargar Nubisfera</span>
    </button>
    <button class="mobile-install-close" (click)="dismissMobileInstall()" aria-label="Cerrar">
      <i class="fas fa-times"></i>
    </button>
  </div>
}
